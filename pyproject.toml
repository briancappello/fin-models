[project]
name = "fin-models"
version = "0.1.0"
description = "Financial Database Models"
authors = [{ name = "Brian Cappello", email = "briancappello@gmail.com" }]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
dependencies = [
    "aiohttp[speedups]==3.9.5",
    "beautifulsoup4>=4,<5",
    "click>=8,<9",
    "lxml>=4.9.2",
    "numpy<2",
    "pandas>=2,<3",
    "requests>=2,<3",
    "sqlalchemy<2",
    "sqlalchemy-unchained>=0.14.0,<0.15",
    "joblib>=1.3.0,<2",
    "ta-lib>=0.5.4,<0.6",
    "scipy>=1.10.0,<2",
    "matplotlib>=3.7.1,<4",
    "alembic>=1.11.1,<1.15",
    "psycopg2>=2.9.6,<3",
    "pandas-market-calendars",
    "marshmallow>=3.20.2,<4",
    "websockets",
    "alpaca-py",
    "tables>=3.9,<4.0",
    "tabulate>=0.9.0",
    "databento>=0.68.0",
    "massive>=2.0.2",
    "networkx>=3.4.2",
    "schwab-py>=1.5.1",
]

[project.urls]
Repository = "https://github.com/briancappello/fin-models"

[project.scripts]
fin = "fin_models.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pandas-stubs>=2.1.4.231227,<3",
    "types-beautifulsoup4>=4.12.0.20240106,<5",
    "types-python-dateutil>=2.8.19.20240106,<3",
    "types-requests>=2.31.0.20240125,<3",
    "sqlalchemy2-stubs>=0.0.2a38,<0.0.3",
    "ruff>=0.14.10",
    "qtconsole>=5.6.1,<6",
    "pyqt6>=6.8.0,<7",
    "notebook>=7.5.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
]

[tool.uv]

[[tool.uv.index]]
name = "PyPI"
url = "https://pypi.org/simple/"
default = true

[tool.hatch.build.targets.sdist]
include = ["fin_models"]

[tool.hatch.build.targets.wheel]
include = ["fin_models"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint.isort]
case-sensitive = true
lines-after-imports = 2
lines-between-types = 1
required-imports = ["from __future__ import annotations"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
    "tests",
]
known-first-party = ["sqlalchemy_unchained"]

[tool.ruff.lint.isort.sections]
tests = ["tests"]

[[tool.mypy.overrides]]
module = [
    "joblib",
    "pandas_market_calendars",
    "scipy.*",
    "talib",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-s --cov=fin_models --cov-report html"
filterwarnings = [
    # note the use of single quote below to denote "raw" strings in TOML
    'ignore:pkg_resources is deprecated:DeprecationWarning',
    'ignore:Deprecated call to `pkg_resources.declare_namespace:DeprecationWarning',
    'ignore:\nPyarrow will become a required dependency of pandas:DeprecationWarning',
]
